<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML and CSS Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <header>
        <h1>Basic HTML and CSS</h1>
    </header>

    <main>
        <form>
            <fieldset>
                <legend>Basic HTML and CSS Quiz</legend>

                <div class="item">
                    <label for="q1"> What does the acronym HTML stand for?</label><br>
                    <input type="text" name="q1" id="q1">
                </div>

                <div class="item">
                    <label for="q2">Differentiate between HtmL and CSS three sentences</label><br>
                    <textarea name="q2" id="q2" rows="4"></textarea>
                </div>

                <div class="item">
                    <label for="q3">Which HTML element is used to define internal css style</label>
                    <select name="q3" id="q3">
                        <option value="" selected disabled>Choose one</option>
                        <option value="input">Input</option>
                        <option value="link">Link</option>
                        <option value="style">Style</option>
                        <option value="select">Select</option>
                        <option value="other">Others</option>
                    </select>
                </div>

                <div class="item">
                    <label for="q4">What is the margin top given in this declaration;
                        <code>margin: 10px 15px 10px;</code></label><br>
                    <input type="number" name="q4" id="q4"><br>
                </div>

                <div class="item">
                    <p>Was this quiz helpful?</p>
                    <label for="yes">Yes</label>
                    <input type="radio" name="feedback" id=yes">
                    <label for="no">No</label>
                    <input type="radio" name="no" id="no">
                </div>

                <button type="submit">Submit</button>
            </fieldset>

        </form>

    </main>
    <footer>

    </footer>
</body>

</html>
