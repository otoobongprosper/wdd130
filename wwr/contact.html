<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Easy means of contacting us. we are open for 24 hours. Reach out today for an uneraseable memory">
    <meta name="author" content="Oto-obong Inyang">
    <title>Contact Us | Water Rafting Company</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/wwr_logo.jpg" alt="White Water Raft Logo">
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main class="contact-page">

        <section class="intro">
            <h1>White Water Rafting Company</h1>

            <address>
                245 Rivers Mainland<br>
                Rivers State, Nigeria<br>
                <a href="tel: +2347060789453">+2347060789435</a> <br>
                <a href="mailto: info@waterraft.com">info@waterraft.com</a>
            </address>
        </section>

        <section class="content">
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d15903.685969506321!2d7.063144680113961!3d4.783491955874154!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sng!4v1791544807078!5m2!1sen!2sng"
                  width="600" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>

            <form>
                <fieldset>
                    <div class="form-row">
                        <label for="name">Name</label>
                        <input type="text" name="name" id="name"
                          placeholder="Please Enter your full name">
                    </div>

                    <div class="form-row">
                        <label for="email">Email</label>
                        <input type="email" name="email" id="email"
                          placeholder="Please enter your email">
                    </div>

                    <div class="purpose-row">
                        <p>message Purpose</p>
                        <div>
                            <input type="radio" name="enquiry" id="enquiry">
                            <label for="enquiry">General Equiry</label>
                        </div>

                        <div>
                            <input type="radio" name="enquiry" id="question">
                            <label for="question">Reservation Question</label>
                        </div>
                        <div>
                            <input type="radio" name="enquiry" id="website">
                            <label for="website">Website Suggestion</label>
                        </div>
                    </div>

                    <div class="message-row">
                        <label for="message">Message</label><br>
                        <textarea name="message" id="message" rows="8"></textarea>
                    </div>

                    <div class="sub-row">
                        <input type="checkbox" name="sub" id="sub">
                        <label for="sub">Please subscribe for monthly newsletter</label>
                    </div>

                    <button type="submit">Get in Touch</button>

                </fieldset>
            </form>
        </section>

        <section class="employee-section">
            <h2>We Are Here to Serve You</h2>

            <div class="employees">
                <figure>
                    <img src="images/employee2.jpg" alt="Employee Photo">
                    <figcaption>Tina Xavi</figcaption>
                </figure>

                <figure>
                    <img src="images/employee1.jpg" alt="employee photo">
                    <figcaption> Enzo Prosper</figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.jpg" alt="employee photo">
                    <figcaption>Praise Hogan</figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p>©2026 | White Water Rafting Company | Oto-obong Inyang</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook_icon.png"
                  alt="Facebook Icon"></a>
            <a href="https://linkedin.com"><img src="images/linkedin_icon.png"
                  alt="Linkeddin Icon"></a>
            <a href="https://instagram.com"><img src="images/instagram_icon.png"
                  alt="Instagram Icon"></a>
        </nav>
    </footer>
</body>

</html>
